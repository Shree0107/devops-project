groups:
  - name: devops-demo-alerts
    rules:
      - alert: ServiceDown
        expr: up{job="devops-demo-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "{{ $labels.job }} has been down for more than 1 minute"

      - alert: HighErrorRate
        expr: sum(rate(flask_http_request_total{status=~"4..|5.."}[5m])) / sum(rate(flask_http_request_total[5m])) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for 2 minutes"

      - alert: SlowResponseTime
        expr: rate(flask_http_request_duration_seconds_sum[5m]) / rate(flask_http_request_duration_seconds_count[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow API response time"
          description: "Average response time is above 500ms"
