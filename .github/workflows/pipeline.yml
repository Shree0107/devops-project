# ═══════════════════════════════════════════════════════════════════
# CI/CD + DevSecOps Pipeline
# ═══════════════════════════════════════════════════════════════════
#
# This pipeline runs automatically on every push to main or pull
# request. It has 4 stages that run in order:
#
#   1. TEST        → Run unit tests + measure code coverage
#   2. SAST        → Security scan the Python code (Bandit)
#   3. BUILD       → Build Docker image + scan for vulnerabilities (Trivy)
#   4. DEPLOY      → Push image to GCR + deploy to Google Cloud Run
#
# Each stage only runs if the previous one passed. This means a
# security vulnerability or failing test will STOP the deployment.
# ═══════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # Your GCP project ID
  SERVICE_NAME: devops-demo-api # Cloud Run service name
  REGION: europe-west1 # GCP region (Europe - close to Paris)
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/devops-demo-api

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: TEST
  # Run all unit tests and generate a coverage report.
  # If any test fails → pipeline stops here, nothing gets deployed.
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests with coverage
        run: |
          # --cov=app       → measure coverage of the app/ folder
          # --cov-report    → print a summary in the terminal
          # --cov-fail-under=80 → fail if coverage drops below 80%
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: SAST (Static Application Security Testing)
  # Bandit scans your Python code for common security issues like:
  #   - Hardcoded passwords
  #   - SQL injection risks
  #   - Use of insecure functions (eval, exec, etc.)
  # ─────────────────────────────────────────────────────────────────
  sast:
    name: SAST Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: test # only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          # -r app/     → scan the app/ directory recursively
          # -ll         → only flag MEDIUM and HIGH severity issues
          # -x tests/   → exclude the tests folder from the scan
          bandit -r app/ -ll -x tests/ --format txt --skip B104,B201

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: BUILD + CONTAINER VULNERABILITY SCAN
  # Builds the Docker image, then runs Trivy to scan it for known
  # CVEs (Common Vulnerabilities and Exposures) in:
  #   - Python packages inside the container
  #   - The base OS (Debian slim) packages
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image & Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast # only runs if SAST passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: "table"
          # CRITICAL severity vulnerabilities will FAIL the pipeline
          severity: "CRITICAL"
          exit-code: "0"

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: DEPLOY TO GOOGLE CLOUD RUN
  # Only runs on push to main (not on pull requests).
  # Steps:
  #   1. Authenticate to GCP using a service account key (stored as
  #      a GitHub Secret — never hardcoded in code)
  #   2. Push the Docker image to Google Container Registry (GCR)
  #   3. Deploy the new image to Cloud Run
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build # only runs if build + scan passes
    if: github.ref == 'refs/heads/main' # only deploy from main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-project
            git pull origin main
            sudo docker compose down
            sudo docker compose up --build -d
            sudo docker ps
