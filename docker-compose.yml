
#
# This starts 3 containers together:
#   1. app        → your Flask API  (http://localhost:8080)
#   2. prometheus → metrics collector (http://localhost:9090)
#   3. grafana    → metrics dashboard (http://localhost:3000)


version: "3.9"

services:

  # ── Flask API ───────────────────────────────────────────────────
  app:
    build: .
    container_name: devops-demo-api
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Prometheus ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────

  # Default login: admin / admin
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana  
    depends_on:
      - prometheus
    restart: unless-stopped

#------Alert manager------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    env_file:
      - .env
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped


volumes:
  grafana-data: 
  prometheus-data:
